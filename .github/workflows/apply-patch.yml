name: Apply patch

# Cara pakai: upload `change.patch` ke root repo (branch main), lalu
# Actions -> "Apply patch" -> Run workflow (isi judul PR).
# Patch diterapkan ke branch patch/run-<id>, dicek (typecheck + tes + build),
# lalu dibuka Pull Request ke main dan CI dijalankan. Kamu yang merge.
# change.patch ikut terhapus saat PR di-merge.

on:
  workflow_dispatch:
    inputs:
      message:
        description: Judul PR / pesan commit
        required: true
        default: Terapkan change.patch

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MESSAGE: ${{ inputs.message }}
      BRANCH: patch/run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Periksa patch
        run: |
          test -f change.patch || { echo "change.patch tidak ditemukan di root repo"; exit 1; }
          if grep -q '^diff --git a/.github/' change.patch; then
            echo "Patch menyentuh .github/ -- token Actions tidak boleh mengubah workflow. Ubah file itu manual."
            exit 1
          fi

      - name: Buat branch dan terapkan patch
        run: |
          git checkout -b "$BRANCH"
          git apply --index change.patch
          git rm -q -f change.patch
          git status --short

      - name: Pasang dependensi
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tes
        run: npm test

      - name: Build web
        run: npm run build

      - name: Commit dan push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MESSAGE"
          git push origin "$BRANCH"

      - name: Buka Pull Request
        run: |
          gh pr create --base main --head "$BRANCH" --title "$MESSAGE" \
            --body "Patch diterapkan otomatis oleh workflow Apply patch. Typecheck, tes, dan build sudah lulus di workflow. Merge jika check test hijau."

      - name: Jalankan CI di branch
        # PR dari GITHUB_TOKEN tidak memicu CI otomatis; dispatch manual memberi check "test" pada commit PR.
        run: gh workflow run ci.yml --ref "$BRANCH"
