name: Apply patch

# Cara pakai: upload `change.patch` ke root repo, lalu
# Actions -> "Apply patch" -> Run workflow (isi pesan commit).
# Patch diterapkan, dicek (typecheck + tes + build), lalu di-commit ke main
# HANYA jika semuanya lulus. change.patch dihapus otomatis setelah itu.
# Hanya pengguna dengan akses tulis ke repo yang bisa menjalankannya.

on:
  workflow_dispatch:
    inputs:
      message:
        description: Pesan commit
        required: true
        default: Terapkan change.patch

permissions:
  contents: write

concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Periksa patch
        run: |
          test -f change.patch || { echo "change.patch tidak ditemukan di root repo"; exit 1; }
          if grep -q '^diff --git a/.github/' change.patch; then
            echo "Patch menyentuh .github/ -- token Actions tidak boleh mengubah workflow. Ubah file itu manual."
            exit 1
          fi

      - name: Terapkan patch
        run: |
          git apply --index change.patch
          git rm -q -f change.patch
          git status --short

      - name: Pasang dependensi
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tes
        run: npm test

      - name: Build web
        run: npm run build

      - name: Commit dan push ke main
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MESSAGE"
          git push origin HEAD:main
